# Site settings. Restart `tools/build.sh` after changing this file.

locale: "en-US"
title: "Zeyu Lin"
description: "Zeyu Lin is a Rotman Ph.D. student studying intelligence and robotics in manufacturing operations."
url: "https://LIMYOYO.github.io"
baseurl: ""
repository: "LIMYOYO/LIMYOYO.github.io"
timezone: America/Toronto

# Shown in the masthead, About section and footer.
author:
  name: "Zeyu Lin"
  avatar: "zeyu-lin-headshot.png"   # in /images/
  bio: "Ph.D. student in Operations Management and Statistics. I study intelligence and robotics in manufacturing operations."
  location: "Toronto, Canada"
  employer: "Rotman School of Management, University of Toronto"
  email: "zeyulin.lin@mail.utoronto.ca"
  googlescholar: "https://scholar.google.com/citations?user=VYcuJEQAAAAJ"
  ssrn: "https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=12351508"
  github: "LIMYOYO"

# Paper groups, in the order they appear. Each paper's `category` picks one.
publication_category:
  workingpapers:
    title: "Working papers"
  manuscripts:
    title: "Journal articles"
  conferences:
    title: "Conference papers"

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: teaching
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: paper

future: true
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - _pages
  - files

exclude:
  - .claude
  - .superpowers
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docs
  - tests
  - tools
  - vendor
  - node_modules
