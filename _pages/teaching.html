---
layout: default
title: "Teaching"
permalink: /teaching/
---
<style>/* Hallmark · hero: banner */</style>
<section class="section">
  <div class="container">
    <header class="head">
      <h1>Teaching</h1>
    </header>
    <ul class="rows">
      {% assign items = site.teaching | sort: "date" | reverse %}
      {% for post in items %}
      <li>
        <a class="row" href="{{ post.url }}">
          <span class="row__title">{{ post.title }}</span>
          <span class="row__area"></span>
          <span class="row__meta">{{ post.venue }}</span>
          <span class="row__out"></span>
          <span class="row__year">{{ post.date | date: "%Y" }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
