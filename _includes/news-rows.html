{%- assign limit = include.limit | default: site.data.news.size -%}
<ul class="rows news">
  {%- for item in site.data.news limit: limit %}
  <li class="news__item" data-news-item>
    <span class="news__date">{{ item.date }}</span>
    <span class="news__text">{{ item.text | markdownify | remove: '<p>' | remove: '</p>' | strip }}</span>
  </li>
  {%- endfor %}
</ul>
