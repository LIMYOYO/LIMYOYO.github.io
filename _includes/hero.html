<div class="hero__grid">
  <div class="hero__text">
    <h1>When machines do the work, who becomes the bottleneck?</h1>
    <p class="hero__lead">I study how AI and robots change the work people still do — and when the person who checks, repairs, and steps in becomes the constraint.</p>
  </div>
  <figure class="hero__figure" data-sim>
    {% include hero-snapshot.svg %}
    <ul class="legend" aria-label="Map key">
      <li><svg class="legend__robot" viewBox="0 0 96 96" aria-hidden="true"><g class="robot is-working"><rect class="robot__body" x="8" y="20" width="80" height="72"/><rect class="robot__eye" x="28" y="40" width="10" height="10"/><rect class="robot__eye" x="58" y="40" width="10" height="10"/></g></svg>Robot working</li>
      <li><svg class="legend__robot" viewBox="0 0 96 96" aria-hidden="true"><g class="robot is-waiting"><rect class="robot__body" x="8" y="20" width="80" height="72"/><rect class="robot__eye" x="28" y="40" width="10" height="10"/><rect class="robot__eye" x="58" y="40" width="10" height="10"/><g class="robot__alert"><line x1="76" y1="0" x2="76" y2="10"/><circle cx="76" cy="15" r="1.8"/></g></g></svg>Waiting for help</li>
      <li><svg viewBox="-14 -40 28 42" aria-hidden="true"><g class="person"><circle class="person__head" cx="0" cy="-31" r="7"/><path class="person__body" d="M-12 0 V-12 Q-12 -21 -3 -21 H3 Q12 -21 12 -12 V0 Z"/></g></svg>Person</li>
    </ul>
    <div class="figure-bar sim__controls" hidden>
      <div class="sim__control">
        <label for="robots">Robots per person</label>
        <div class="sim__range">
          <input type="range" id="robots" min="1" max="12" value="6" step="1" autocomplete="off">
          <output for="robots" id="robots-value">6</output>
        </div>
      </div>
      <fieldset class="sim__control">
        <legend>When help is needed</legend>
        <div class="sim__choices">
          <label><input type="radio" name="timing" value="scattered" autocomplete="off" checked> Scattered</label>
          <label><input type="radio" name="timing" value="bursts" autocomplete="off"> In bursts</label>
        </div>
      </fieldset>
      <div class="sim__control sim__play">
        <button type="button" class="btn sim__toggle">Pause</button>
        <button type="button" class="btn sim__step" hidden>Step</button>
      </div>
    </div>
    <p class="sim__readout" data-readout aria-live="off" hidden></p>
    <p class="sr-only" aria-live="polite" data-announce></p>
    <figcaption class="figure-note">An illustration of the mechanism, not a result.</figcaption>
  </figure>
</div>
<script type="module" src="/assets/js/bottleneck.js"></script>
